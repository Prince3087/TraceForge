<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="lensShading2" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="70%" stop-color="#0e1117"/>
      <stop offset="100%" stop-color="#05070a"/>
    </radialGradient>
    <linearGradient id="metalSheen2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <!-- Degraded PAO Grease Stain Pattern (Ambiguous Discoloration) -->
    <radialGradient id="oxidizedGrease" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#ca8a04" stop-opacity="0.65"/>
      <stop offset="80%" stop-color="#854d0e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#854d0e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="microGrid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="600" height="600" fill="url(#lensShading2)"/>
  <rect width="600" height="600" fill="url(#microGrid2)" opacity="0.6"/>

  <!-- HUD Reticle -->
  <circle cx="300" cy="300" r="240" fill="none" stroke="#eab308" stroke-width="1" stroke-dasharray="8 6" opacity="0.5"/>
  <line x1="40" y1="300" x2="120" y2="300" stroke="#eab308" stroke-width="1" opacity="0.5"/>
  <line x1="480" y1="300" x2="560" y2="300" stroke="#eab308" stroke-width="1" opacity="0.5"/>

  <!-- SMT Feeder Spindle Head -->
  <circle cx="300" cy="300" r="150" fill="url(#metalSheen2)" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="300" cy="300" r="110" fill="#1e293b" stroke="#0f172a" stroke-width="4"/>
  <circle cx="300" cy="300" r="70" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <circle cx="300" cy="300" r="25" fill="#0f172a" stroke="#eab308" stroke-width="1.5"/>

  <!-- The Ambiguous Defect: Thermal Grease Seepage (Section 4.2 Violation) -->
  <path d="M 290 230 C 330 220, 370 250, 365 290 C 360 320, 340 335, 305 320 C 275 305, 270 245, 290 230 Z" 
        fill="url(#oxidizedGrease)" 
        stroke="#ca8a04" 
        stroke-width="1.2" 
        stroke-dasharray="3 2"/>

  <!-- TraceForge / Edge Vision Bounding Box Crop Target -->
  <rect x="255" y="210" width="130" height="130" rx="4" fill="none" stroke="#00f3ff" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="258" y="202" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00f3ff">ROI_01: ΔE=3.82 [AMBIGUOUS]</text>

  <!-- AOI Sensor Status Overlays -->
  <text x="35" y="50" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00f3ff" letter-spacing="1.5">CAM_04 [STATION_2B] // CAPTURED</text>
  <text x="35" y="70" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">EXP: 1/4000s | GAIN: 0.0dB | CLASSIFICATION: SUB-THRESHOLD ANOMALY</text>
  <rect x="35" y="535" width="225" height="30" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="147" y="555" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">STATUS: AMBIGUOUS (YELLOW)</text>
  <text x="565" y="555" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fbbf24" text-anchor="end">ΔE_MAX: 3.82 (THRESH: 3.0)</text>
</svg>
